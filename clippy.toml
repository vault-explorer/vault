# Lint levels live in [workspace.lints] in Cargo.toml; CI runs clippy with
# `-D warnings`, so every warning blocks a merge.
msrv = "1.90"
allow-unwrap-in-tests = true
allow-expect-in-tests = true
# Proper nouns that the doc_markdown lint would otherwise want in backticks.
doc-valid-idents = ["SQLite", "WebView2", "PowerShell", ".."]
