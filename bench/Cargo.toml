[package]
name = "vault-bench"
description = "Performance benchmarks for Vault, run in CI against the budgets in docs/PERFORMANCE.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
bench = false

[[bin]]
name = "vault-fixtures"
path = "src/bin/vault-fixtures.rs"
bench = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
vault-core.workspace = true
vault-index.workspace = true

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "core"
harness = false

[lints]
workspace = true
