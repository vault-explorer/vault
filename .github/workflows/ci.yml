name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Full build, test and lint on the MVP platform.
  windows:
    name: Windows · build, test, lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: eslint
        run: pnpm lint
      - name: prettier
        run: pnpm format:check
      - name: typecheck
        run: pnpm typecheck

      - name: cargo test
        run: cargo test --workspace
      # Release build with installers, so every PR has a downloadable Windows build.
      # Builds are unsigned until code signing is set up (docs/WINDOWS.md).
      - name: Build app and installers
        run: pnpm tauri build
      - name: Report build sizes
        shell: pwsh
        run: |
          # Installer budget: < 15 MB (docs/PERFORMANCE.md). Reported, not yet enforced.
          "| File | Size (MB) |`n| --- | --- |" >> $env:GITHUB_STEP_SUMMARY
          Get-Item target/release/vault.exe, target/release/bundle/msi/*.msi, target/release/bundle/nsis/*.exe |
            ForEach-Object { "| $($_.Name) | $([math]::Round($_.Length / 1MB, 2)) |" >> $env:GITHUB_STEP_SUMMARY }
      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          # PR builds are named by the PR head commit (github.sha is the temporary merge commit).
          name: vault-windows-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/release/vault.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # Keep the code portable from day one; full tests on these OSes start in Phase 2.
  check:
    name: ${{ matrix.os }} · cargo check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  # The declared rust-version must actually build.
  msrv:
    name: MSRV (1.90) · cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  # Placeholder: runs the benches once in test mode so they keep compiling.
  # The Phase 0 harness replaces this with a comparison against main that fails
  # on a >10% regression (docs/PERFORMANCE.md, docs/backlog/phase-0.md).
  bench:
    name: Benchmarks (placeholder)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p vault-bench -- --test
