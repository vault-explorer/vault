name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Full build, test and lint on the MVP platform.
  windows:
    name: Windows · build, test, lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: eslint
        run: pnpm lint
      - name: prettier
        run: pnpm format:check
      - name: typecheck
        run: pnpm typecheck

      - name: cargo test
        run: cargo test --workspace
      - name: bench script tests
        run: pnpm test:bench-scripts
      # Release build with installers, so every PR has a downloadable Windows build.
      # Builds are unsigned until code signing is set up (docs/WINDOWS.md).
      - name: Build app and installers
        run: pnpm tauri build
      - name: Report build sizes
        shell: pwsh
        run: |
          # Installer budget: < 15 MB (docs/PERFORMANCE.md). Reported, not yet enforced.
          "| File | Size (MB) |`n| --- | --- |" >> $env:GITHUB_STEP_SUMMARY
          Get-Item target/release/vault.exe, target/release/bundle/msi/*.msi, target/release/bundle/nsis/*.exe |
            ForEach-Object { "| $($_.Name) | $([math]::Round($_.Length / 1MB, 2)) |" >> $env:GITHUB_STEP_SUMMARY }
      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          # PR builds are named by the PR head commit (github.sha is the temporary merge commit).
          name: vault-windows-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/release/vault.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # Keep the code portable from day one; full tests on these OSes start in Phase 2.
  check:
    name: ${{ matrix.os }} · cargo check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  # The declared rust-version must actually build.
  msrv:
    name: MSRV (1.90) · cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  # Benches the PR's merge base and head in this one job, so both see the same
  # runner, and posts the comparison to the job summary. Report-only: it can't fail
  # the build, because shared runners are too noisy to gate on (docs/adr/0014).
  bench:
    name: Benchmarks · base vs head (report-only)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 90
    env:
      # A newer stable shouldn't be able to break the build of an older base commit.
      RUSTFLAGS: ""
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      VAULT_BENCH_FIXTURES: ${{ github.workspace }}/fixtures
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
      - name: Check out base commit
        id: base
        shell: pwsh
        working-directory: head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $base = git merge-base $env:BASE_SHA $env:HEAD_SHA
          # A base from before the harness has nothing to run, so measure head twice.
          # Differences in that table are pure runner noise.
          git cat-file -e "${base}:bench/budgets.json" 2>$null
          if ($LASTEXITCODE -ne 0) {
            "::notice::Base $base has no bench harness; running head against itself."
            "same_commit=true" >> $env:GITHUB_OUTPUT
            $base = $env:HEAD_SHA
          }
          $global:LASTEXITCODE = 0
          git worktree add --detach ../base $base
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: head -> ../target
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: head/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: head/pnpm-lock.yaml

      # Each commit generates fixtures with its own generator. That reuses the tree
      # unless the PR changes the generator, and then each side still gets its own.
      - name: Bench base
        continue-on-error: true
        working-directory: base
        run: |
          pnpm install --frozen-lockfile
          cargo run -p vault-bench --release --bin vault-fixtures -- generate
          node ../head/bench/scripts/run.mjs --repo . --out ../results/base
      - name: Bench head
        continue-on-error: true
        working-directory: head
        run: |
          pnpm install --frozen-lockfile
          cargo run -p vault-bench --release --bin vault-fixtures -- generate
          node bench/scripts/run.mjs --repo . --out ../results/head

      - name: Post comparison to job summary
        continue-on-error: true
        shell: pwsh
        env:
          SAME_COMMIT: ${{ steps.base.outputs.same_commit }}
        run: |
          "## Benchmarks (report-only)`n" >> $env:GITHUB_STEP_SUMMARY
          if ($env:SAME_COMMIT -eq "true") {
            "Base has no bench harness, so this compares head with itself. Changes are runner noise.`n" >> $env:GITHUB_STEP_SUMMARY
          }
          node head/bench/scripts/compare.mjs results/base results/head *>&1 | Tee-Object -Variable report
          $report >> $env:GITHUB_STEP_SUMMARY
      - name: Upload results
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-${{ github.event.pull_request.head.sha }}
          path: results/*/*.json
          retention-days: 14
